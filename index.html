<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵建成 · AI智能应用开发工程师 · 在线简历</title>
<meta name="description" content="赵建成 — 3年开发经验，AI智能应用开发工程师。在线简历预览与 PDF 下载。">
<style>
  :root{
    --bg:#0f1117;
    --panel:#171a23;
    --border:#262b38;
    --text:#e8ebf2;
    --muted:#98a2b8;
    --accent:#4f8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 20% -10%, #1b2333 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 22px;
    background:rgba(23,26,35,.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:10;
  }
  .id{display:flex;align-items:baseline;gap:10px}
  .name{font-size:17px;font-weight:600;letter-spacing:.4px}
  .role{font-size:12.5px;color:var(--muted)}
  .spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border-radius:8px;
    font-size:13px;font-weight:500;text-decoration:none;
    border:1px solid var(--border);color:var(--text);
    background:var(--panel);transition:.18s ease;white-space:nowrap;
  }
  .btn:hover{border-color:#3a4256}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#3d7bf5;border-color:#3d7bf5}
  main{flex:1;display:flex;flex-direction:column;min-height:0;padding:18px 22px 22px}
  .frame-wrap{
    flex:1;min-height:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  object,iframe{width:100%;height:100%;border:0;display:block}
  .fallback{padding:40px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
  .fallback a{color:var(--accent)}
  footer{
    padding:10px 22px;font-size:12px;color:var(--muted);
    border-top:1px solid var(--border);background:rgba(23,26,35,.6);
    display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;
  }
  @media (max-width:640px){
    header{padding:12px 14px}
    .role{display:none}
    main{padding:12px}
    .btn{padding:7px 12px;font-size:12px}
  }
</style>
</head>
<body>
  <header>
    <div class="id">
      <span class="name">赵建成</span>
      <span class="role">3年开发经验 · AI智能应用开发工程师</span>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="resume.pdf" target="_blank" rel="noopener">新标签打开</a>
    <a class="btn btn-primary" href="resume.pdf" download="赵建成-AI智能应用开发工程师-简历.pdf">下载 PDF</a>
  </header>

  <main>
    <div class="frame-wrap">
      <object data="resume.pdf#view=FitH" type="application/pdf" aria-label="简历预览">
        <iframe src="resume.pdf#view=FitH" title="简历预览"></iframe>
        <div class="fallback">
          当前浏览器无法内嵌显示 PDF。<br>
          <a href="resume.pdf" target="_blank" rel="noopener">点击此处在线查看</a> 或
          <a href="resume.pdf" download>下载 PDF</a>。
        </div>
      </object>
    </div>
  </main>

  <footer>
    <span>在线简历 · 持续更新</span>
    <span>建议使用 Chrome / Edge 浏览器获得最佳预览效果</span>
  </footer>
</body>
</html>
